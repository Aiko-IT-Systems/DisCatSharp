    documentation:
        runs-on: ubuntu-latest
        name: Upload documentation
        needs: build
        steps:
            - name: Checkout docs repository
              uses: actions/checkout@v7
              with:
                  repository: Aiko-IT-Systems/DisCatSharp.Docs
                  token: ${{ secrets.NYUW_TOKEN_GH }}
            - name: Purge old docs
              shell: pwsh
              run: Get-ChildItem -Exclude .git* | Remove-Item -Recurse -Force
            - name: Download packed docs
              uses: actions/download-artifact@v8
              with:
                  name: dcs-docs.zip
            - name: Extract new docs
              run: unzip dcs-docs.zip -d .
            - name: Deleze zip
              run: rm dcs-docs.zip
            - name: Delete packed docs
              uses: geekyeggo/delete-artifact@v6
              with:
                  name: dcs-docs.zip
            - name: Add .htaccess
              run: rm -f .htaccess && wget https://gist.githubusercontent.com/Lulalaby/8a032d0ddebb9125691094edc67b6593/raw/0c4bf0423cfe334fdd5092b014d2481759dd052a/.htaccess
            #- name: Add _redirects
            #  run: rm -f _redirects && wget https://gist.githubusercontent.com/Lulalaby/0c784680a855fd161411002e3859b4fd/raw/9708d1acfce3f647cbb8da19c2022a20198979fa/_redirects
            - name: Set access rights
              run: sudo chmod 777 -R .
            - name: Commit and push changes
              uses: EndBug/add-and-commit@main
              with:
                  default_author: user_info
                  author_name: NyuwBot
                  author_email: nyuw@aitsys.dev
                  committer_name: NyuwBot
                  committer_email: nyuw@aitsys.dev
                  commit: --signoff
                  message: "Docs update (https://github.com/${{github.repository}}/commit/${{github.sha}})"
    activate-search:
        runs-on: ubuntu-latest
        name: Activate documentation search
        needs: documentation
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: DisCatSharp.Docs/search/package-lock.json
            - name: Install search dependencies
              run: npm ci
              working-directory: DisCatSharp.Docs/search
            - name: Download staged search index
              uses: actions/download-artifact@v8
              with:
                  name: dcs-search-index
                  path: DisCatSharp.Docs/obj/search
            - name: Prepare production search configuration
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: npm run prepare:production
              working-directory: DisCatSharp.Docs/search
            - name: Wait for matching documentation deployment
              env:
                  DCS_DOCS_BASE_URL: https://discatsharp-docs.pages.dev
              run: npm run wait:docs -- ../obj/search/search-index.json
              working-directory: DisCatSharp.Docs/search
            - name: Activate staged search index
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: npm run sync:activate -- ../obj/search/search-index.json
              working-directory: DisCatSharp.Docs/search
            - name: Smoke test search and MCP
              env:
                  EXPECTED_BUILD_SHA: ${{ github.sha }}
              run: npm run smoke:production
              working-directory: DisCatSharp.Docs/search
