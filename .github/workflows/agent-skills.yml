name: "Agent Skills"

on:
    pull_request:
        paths:
            - "skills/**"
            - "AGENTS.md"
            - "CLAUDE.md"
            - "GEMINI.md"
            - ".github/copilot-instructions.md"
    push:
        branches:
            - main
        paths:
            - "skills/**"
            - "AGENTS.md"
            - "CLAUDE.md"
            - "GEMINI.md"
            - ".github/copilot-instructions.md"
    workflow_dispatch:
        inputs:
            release:
                description: "Release version"
                required: false
                default: false
                type: boolean
            version:
                description: "Release version (e.g. skills@v1.0.0)"
                required: false
                type: string

permissions:
    contents: write
    id-token: write
    attestations: write
    artifact-metadata: write
    packages: write

env:
    GH_TOKEN: ${{ github.token }}

jobs:
    validate:
        runs-on: ubuntu-latest
        name: Validate Agent Skills
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                sparse-checkout: |
                  skills
                  .github
                  AGENTS.md
                  CLAUDE.md
                  GEMINI.md
            - name: Validate Agent Skills specification
              id: validate
              run: gh skill publish --dry-run
            - name: Generate Report
              if: always()
              run: |
                    echo "Generating report..."
                    failure=${{ steps.validate.outcome == 'failure' }}
                    if [[ "$failure" == "true" ]]; then
                        echo "Skill validation failed" > "$GITHUB_STEP_SUMMARY"
                    else
                        echo "Skill validation successful" > "$GITHUB_STEP_SUMMARY"
                    fi
            - name: Verify Agent Skills
              shell: bash
              id: verify
              run: |
                  agents=(
                    codex
                    github-copilot
                    claude-code
                    gemini-cli
                    cursor
                    opencode
                  )
                  for agent in "${agents[@]}"; do
                    destination="$RUNNER_TEMP/$agent"
                    mkdir -p "$destination"
                    git -C "$destination" init --quiet
                    (
                      cd "$destination"
                      gh skill install "$GITHUB_WORKSPACE" use-discatsharp \
                        --from-local --agent "$agent" --scope project --force
                      gh skill install "$GITHUB_WORKSPACE" maintain-discatsharp \
                        --from-local --agent "$agent" --scope project --force
                    )
                    test "$(find "$destination" -name SKILL.md -type f | wc -l)" -eq 2
                  done
            - name: Generate Report
              if: always()
              run: |
                    echo "Generating report..."
                    failure=${{ steps.verify.outcome == 'failure' }}
                    if [[ "$failure" == "true" ]]; then
                        echo "Skill verification failed" > "$GITHUB_STEP_SUMMARY"
                    else
                        echo "Skill verification successful" > "$GITHUB_STEP_SUMMARY"
                    fi
    release:
        runs-on: ubuntu-latest
        name: Release Agent Skills
        needs: [validate]
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.version != '' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                sparse-checkout: |
                  skills
                  .github
                  AGENTS.md
                  CLAUDE.md
                  GEMINI.md
            - name: Generate build provenance
              id: attest
              uses: actions/attest@v4
              with:
                  subject-path: |
                    skills/*
                    AGENTS.md
                    CLAUDE.md
                    GEMINI.md
                    .github/copilot-instructions.md
            - name: Generate Report Provenance Failure
              if: always()
              run: |
                    echo "Generating provenance report..."
                    failure=${{ steps.attest.outcome == 'failure' }}
                    if [[ "$failure" == "true" ]]; then
                        echo "Provenance generation failed" > "$GITHUB_STEP_SUMMARY"
                    else
                        echo "Provenance generation successful" > "$GITHUB_STEP_SUMMARY"
                    fi
            - name: Release Agent Skills
              id: release
              if: success()
              run: |
                  version="${{ github.event.inputs.version }}"
                  if [[ -z "$version" ]]; then
                    echo "Error: Release version is required when release input is true."
                    exit 1
                  fi
                  gh skill publish --tag "$version"
            - name: Generate Report
              if: always()
              run: |
                  echo "Generating report..."
                  failure=${{ steps.release.outcome == 'failure' }}
                  if [[ "$failure" == "true" ]]; then
                    echo "Skill release failed" > "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Skill release successful" > "$GITHUB_STEP_SUMMARY"
                  fi