name: "Test Documentation"
on:
    workflow_dispatch:

env:
    DOTNET_NOLOGO: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: true

jobs:
    test_documentation:
        timeout-minutes: 35
        runs-on: ubuntu-latest
        name: Build documentation
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.NYUW_TOKEN_GH }}
                  path: GitHub/DisCatSharp
            - name: Checkout docs repository
              uses: actions/checkout@v7
              with:
                  repository: Aiko-IT-Systems/DisCatSharp.Docs
                  token: ${{ secrets.NYUW_TOKEN_GH }}
                  path: GitHub/DisCatSharp.Docs
                  ref: main
            - name: Setup .NET
              uses: actions/setup-dotnet@v6.0.0
              with:
                  dotnet-version: |
                      11.x
                      10.x
                      9.x
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: GitHub/DisCatSharp/DisCatSharp.Docs/search/package-lock.json
            - name: Install DocFX
              run: dotnet tool update -g docfx
              continue-on-error: true
            - name: Restore packages
              run: dotnet restore --no-cache -f -v minimal DisCatSharp.slnx
              working-directory: GitHub/DisCatSharp
            - name: Install search dependencies
              run: npm ci
              working-directory: GitHub/DisCatSharp/DisCatSharp.Docs/search
            - name: Test search indexer
              run: dotnet test DisCatSharp.Tools/DisCatSharp.Docs.SearchIndexer.Tests/DisCatSharp.Docs.SearchIndexer.Tests.csproj -c Release --no-restore -v minimal
              working-directory: GitHub/DisCatSharp
            - name: Build library
              run: dotnet build -c Release -v minimal -f net10.0 --no-restore DisCatSharp.slnx
              timeout-minutes: 7
              working-directory: GitHub/DisCatSharp
            - name: Build Docs
              run: docfx DisCatSharp.Docs/docfx.json --metadata _dcsSearchEndpoint=https://docs.dcs.aitsys.dev/_search
              working-directory: GitHub/DisCatSharp
            - name: Remove stock browser search assets
              shell: pwsh
              run: |
                  Remove-Item DisCatSharp.Docs/_site/index.json -ErrorAction SilentlyContinue
                  Remove-Item DisCatSharp.Docs/_site/public/search-worker.min.js -ErrorAction SilentlyContinue
              working-directory: GitHub/DisCatSharp
            - name: Assert stock browser search assets are absent
              shell: bash
              run: |
                  test ! -e DisCatSharp.Docs/_site/index.json
                  test ! -e DisCatSharp.Docs/_site/public/search-worker.min.js
              working-directory: GitHub/DisCatSharp
            - name: Generate documentation search index
              run: >-
                  dotnet run --project DisCatSharp.Tools/DisCatSharp.Docs.SearchIndexer/DisCatSharp.Docs.SearchIndexer.csproj
                  -c Release --no-restore --
                  --repo .
                  --docs DisCatSharp.Docs
                  --site DisCatSharp.Docs/_site
                  --output DisCatSharp.Docs/obj/search/search-index.json
                  --commit ${{ github.sha }}
              working-directory: GitHub/DisCatSharp
            - name: Write documentation build marker
              run: npm run marker -- ../obj/search/search-index.json ../_site/search-build.json
              working-directory: GitHub/DisCatSharp/DisCatSharp.Docs/search
            - name: Validate search Worker and UI
              run: |
                  npm run types:check
                  npm run build
                  npm test
                  npm run migrate:local
                  npm run deploy:dry
              working-directory: GitHub/DisCatSharp/DisCatSharp.Docs/search
            - name: Smoke test production search and MCP
              run: npm run smoke:production
              working-directory: GitHub/DisCatSharp/DisCatSharp.Docs/search
            - name: Pack Docs
              shell: pwsh
              run: ./DisCatSharp.Tools/pack-docs.ps1 -DocsPath "./DisCatSharp.Docs" -OutputPath "./" -PackageName "dcs-docs-preview"
              working-directory: GitHub/DisCatSharp
            - name: Upload packed docs
              uses: actions/upload-artifact@v7
              with:
                  name: dcs-docs-preview.zip
                  path: GitHub/DisCatSharp/dcs-docs-preview.zip
                  retention-days: 2
            - name: Create branch if not exists
              run: |
                  git fetch origin
                  if git show-ref --verify refs/remotes/origin/${{ github.ref_name }}; then
                    echo "Branch exists"
                    git checkout -b ${{ github.ref_name }}
                  else
                    git checkout -b ${{ github.ref_name }}
                    git push origin ${{ github.ref_name }}
                  fi
              working-directory: GitHub/DisCatSharp.Docs
            - name: Purge old docs
              shell: pwsh
              run: Get-ChildItem -Exclude .git* | Remove-Item -Recurse -Force
              working-directory: GitHub/DisCatSharp.Docs
            - name: Download packed docs
              uses: actions/download-artifact@v8
              with:
                  name: dcs-docs-preview.zip
                  path: GitHub/DisCatSharp.Docs
            - name: Extract new docs
              run: unzip dcs-docs-preview.zip -d .
              working-directory: GitHub/DisCatSharp.Docs
            - name: Delete zip
              run: rm dcs-docs-preview.zip
              working-directory: GitHub/DisCatSharp.Docs
            - name: Add .htaccess
              run: rm -f .htaccess && wget https://gist.githubusercontent.com/Lulalaby/8a032d0ddebb9125691094edc67b6593/raw/0c4bf0423cfe334fdd5092b014d2481759dd052a/.htaccess
              working-directory: GitHub/DisCatSharp.Docs
            #- name: Add _redirects
            #  run: rm -f _redirects && wget https://gist.githubusercontent.com/Lulalaby/0c784680a855fd161411002e3859b4fd/raw/9708d1acfce3f647cbb8da19c2022a20198979fa/_redirects
            - name: Set access rights
              run: sudo chmod 777 -R .
              working-directory: GitHub/DisCatSharp.Docs
            - name: Commit changes
              run: |
                  git config user.name NyuwBot
                  git config user.email nyuw@aitsys.dev
                  git add .
                  git commit -m "Test-Docs update (https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
                  git push --set-upstream origin ${{ github.ref_name }} -f
              working-directory: GitHub/DisCatSharp.Docs
            - name: Add PR Comment
              if: always()
              uses: mshick/add-pr-comment@v3
              with:
                  refresh-message-position: true
                  message-success: |
                      Documentation test build passed! :tada:
                      Visit the cloudflare action run in https://github.com/Aiko-IT-Systems/DisCatSharp.Docs/commits/${{ github.ref_name }} for details :3

                      ![gif](https://media.tenor.com/3PjRNS8paykAAAAC/pat-pat-head.gif)
                  message-failure: "Documentation test build failed! :x:"
